name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: python -c "from app.config import settings; print(f'Config OK: port={settings.agent_framework_port}')"

      - name: Build Docker image
        run: docker build -t loom-ai-agent-framework .

      # TODO: Add your deployment steps here
